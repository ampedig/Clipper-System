@@include('../partials/head.html', {
  "title": "Lupa Kata Sandi"
})

<style>
  /* Ensure auth screen is vertically centered without bottom-nav gap */
  .mobile-container {
    padding-bottom: 0 !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    min-height: 100dvh !important;
  }
</style>

<!-- Centered Modern Minimal Forgot Password Screen (No Header) -->
<div class="w-full px-5 py-8 my-auto space-y-6">

  <!-- Hero Branding Header (Rata Tengah) -->
  <div class="text-center">
    <div class="w-14 h-14 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 text-2xl mx-auto mb-4">
      <i class="fa-solid fa-key"></i>
    </div>
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Lupa Kata Sandi?</h1>
    <p class="text-xs text-slate-400 font-medium mt-1.5 max-w-[290px] mx-auto leading-relaxed">
      Masukkan email terdaftar Anda. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi.
    </p>
  </div>

  <!-- Reset Password Form Panel (Modern Minimal Panel System - No Shadow) -->
  <form id="forgot-form" class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4" novalidate>
    
    <!-- Field: Email Terdaftar -->
    <div>
      <label for="email" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
        Email Terdaftar
      </label>
      <div class="relative flex items-center rounded-xl bg-slate-50/80 border border-slate-200 focus-within:border-indigo-500 focus-within:bg-white transition-colors overflow-hidden">
        <input 
          type="email" 
          id="email" 
          name="email"
          placeholder="nama@email.com" 
          autocomplete="email"
          class="w-full px-4 py-3.5 bg-transparent text-sm font-semibold text-slate-900 placeholder:text-slate-400 focus:outline-none" 
        />
      </div>
      <div id="email-error" class="hidden mt-1.5 flex items-center gap-1.5 text-xs font-semibold text-rose-500">
        <i class="fa-solid fa-circle-exclamation text-[11px]"></i>
        <span id="email-error-text">Email tidak boleh kosong</span>
      </div>
    </div>

    <!-- Submit Button (Kirim Tautan) -->
    <div class="pt-1">
      <button 
        type="submit" 
        id="btn-submit"
        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer"
      >
        <span id="btn-text">Kirim Tautan Reset</span>
        <i id="btn-icon" class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </div>

  </form>

  <!-- Back to Login Link Prompt (Rata Tengah) -->
  <div class="text-center">
    <p class="text-xs text-slate-500 font-medium">
      Sudah ingat kata sandi Anda? 
      <a href="login.html" class="font-bold text-indigo-600 hover:text-indigo-700 hover:underline transition-colors ml-1">
        Kembali ke Masuk
      </a>
    </p>
  </div>

</div>

@@include('../partials/vendor-script.html')

<!-- Interactive Script for Form Validation & Submission -->
<script>
  const forgotForm = document.getElementById('forgot-form');
  const emailInput = document.getElementById('email');
  const emailError = document.getElementById('email-error');
  const emailErrorText = document.getElementById('email-error-text');
  const btnSubmit = document.getElementById('btn-submit');
  const btnText = document.getElementById('btn-text');
  const btnIcon = document.getElementById('btn-icon');

  function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  // Clear errors when typing
  emailInput.addEventListener('input', () => {
    emailError.classList.add('hidden');
    emailInput.closest('div').classList.remove('border-rose-400');
  });

  forgotForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const emailVal = emailInput.value.trim();

    if (!emailVal) {
      emailErrorText.textContent = 'Email tidak boleh kosong';
      emailError.classList.remove('hidden');
      emailInput.closest('div').classList.add('border-rose-400');
      return;
    }

    if (!validateEmail(emailVal)) {
      emailErrorText.textContent = 'Format email tidak valid';
      emailError.classList.remove('hidden');
      emailInput.closest('div').classList.add('border-rose-400');
      return;
    }

    emailError.classList.add('hidden');
    emailInput.closest('div').classList.remove('border-rose-400');

    // Loading State
    btnSubmit.disabled = true;
    btnText.textContent = 'Mengirim...';
    btnIcon.className = 'fa-solid fa-circle-notch fa-spin text-xs';

    // Simulate sending reset email
    setTimeout(() => {
      btnSubmit.disabled = false;
      btnText.textContent = 'Kirim Tautan Reset';
      btnIcon.className = 'fa-solid fa-paper-plane text-xs';

      if (typeof Swal !== 'undefined') {
        Swal.fire({
          html: `
            <div class="flex flex-col items-center text-center pt-2">
              <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl mb-4 border border-emerald-100/80">
                <i class="fa-solid fa-paper-plane"></i>
              </div>
              <h3 class="text-base font-bold text-slate-900 mb-1.5 tracking-tight">Tautan Terkirim!</h3>
              <p class="text-xs text-slate-500 font-medium leading-relaxed max-w-[270px]">
                Instruksi reset kata sandi telah dikirim ke <span class="font-bold text-slate-800">${emailVal}</span>. Silakan periksa email Anda.
              </p>
            </div>
          `,
          showConfirmButton: true,
          confirmButtonText: 'Kembali ke Masuk',
          buttonsStyling: false,
          backdrop: 'rgba(15, 23, 42, 0.65)',
          customClass: {
            popup: 'custom-swal-popup !rounded-[2rem] p-6',
            confirmButton: 'w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all active:scale-[0.98] cursor-pointer mt-4'
          }
        }).then(() => {
          window.location.href = 'login.html';
        });
      } else {
        alert('Tautan reset kata sandi telah dikirim ke ' + emailVal);
        window.location.href = 'login.html';
      }
    }, 700);
  });
</script>
